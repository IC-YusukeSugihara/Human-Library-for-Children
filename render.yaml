# Render の無料 Web サービス用の設定（Blueprint）
# 秘密の値（sync: false）は Render の管理画面で入れる
services:
  - type: web
    name: human-library-for-children
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5
